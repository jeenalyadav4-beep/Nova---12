name: Build Nova 12 ISO
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compilers
        run: sudo apt-get update && sudo apt-get install -y nasm genisoimage

      - name: Compile Graphical Kernel
        run: nasm -f bin desktop_kernel.asm -o boot.bin

      - name: Create Virtual Core Disk Image
        run: |
          dd if=/dev/zero of=boot.img bs=1024 count=1440
          dd if=boot.bin of=boot.img conv=notrunc

      - name: Generate Bootable ISO File
        run: |
          mkdir -p iso
          cp boot.img iso/
          genisoimage -o Nova12.iso -b boot.img -hide boot.img iso

      - name: Upload Finished ISO for Users
        uses: actions/upload-artifact@v4
        with:
          name: Nova12-Bootable-ISO
          path: Nova12.iso
